<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Employee Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-people-fill me-2"></i>Employee Directory
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/employees}">Employees</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/departments}">Departments</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/positions}">Positions</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/admin/users}">Users</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row mb-4">
        <div class="col">
            <h2 class="fw-bold"><i class="bi bi-person-badge me-2 text-primary"></i>Manage Users</h2>
            
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- Add Form -->
        <div class="col-md-4 mb-4">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-primary text-white fw-bold">Create New User</div>
                <div class="card-body">
                    <form th:action="@{/admin/users/add}" method="post" th:object="${user}">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Username</label>
                            <input type="text" class="form-control" th:field="*{username}" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''" placeholder="Login name">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <input type="password" class="form-control" th:field="*{password}" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" placeholder="Raw password">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="role" class="form-label fw-semibold">Role</label>
                            <select class="form-select" th:field="*{role}">
                                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-person-plus me-1"></i>Create User
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- List -->
        <div class="col-md-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>Username</th>
                                <th>Role</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u, iterStat : ${users}">
                                <td th:text="${iterStat.count}">1</td>
                                <td th:text="${u.username}" class="fw-semibold">Name</td>
                                <td>
                                    <span class="badge" th:classappend="${u.role.name() == 'ROLE_ADMIN'} ? 'bg-danger' : 'bg-success'" th:text="${u.role}">ROLE</span>
                                </td>
                                <td class="text-center">
                                    <button type="button" class="btn btn-sm btn-outline-warning" title="Change Password"
                                            data-bs-toggle="modal" th:data-bs-target="'#changePwdModal' + ${u.id}">
                                        <i class="bi bi-key"></i>
                                    </button>
                                    <form th:action="@{/admin/users/delete/{id}(id=${u.id})}" method="post" class="d-inline"
                                          onsubmit="return confirm('Delete this user? They will not be able to log in.');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete" th:disabled="${#authentication.name == u.username}">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>

                                    <!-- Change Password Modal for this user -->
                                    <div class="modal fade text-start" th:id="'changePwdModal' + ${u.id}" tabindex="-1">
                                      <div class="modal-dialog">
                                        <div class="modal-content">
                                          <div class="modal-header bg-warning">
                                            <h5 class="modal-title"><i class="bi bi-key me-2"></i>Change Password</h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                          </div>
                                          <form th:action="@{/admin/users/change-password}" method="post">
                                            <div class="modal-body">
                                              <input type="hidden" name="userId" th:value="${u.id}" />
                                              <p>Changing password for user: <strong th:text="${u.username}"></strong></p>
                                              <div class="mb-3">
                                                  <label class="form-label fw-semibold">New Password</label>
                                                  <input type="password" class="form-control" name="newPassword" required minlength="6">
                                              </div>
                                              <div class="mb-3">
                                                  <label class="form-label fw-semibold">Confirm Password</label>
                                                  <input type="password" class="form-control" name="confirmPassword" required minlength="6">
                                              </div>
                                            </div>
                                            <div class="modal-footer">
                                              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                              <button type="submit" class="btn btn-warning fw-bold">Save Password</button>
                                            </div>
                                          </form>
                                        </div>
                                      </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
