<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Employee Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-people-fill me-2"></i>Employee Directory
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/employees}">
                        <i class="bi bi-list-ul me-1"></i>Employees
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'SUPERADMIN')">
                    <a class="nav-link" th:href="@{/admin/employees/add}">
                        <i class="bi bi-person-plus me-1"></i>Add Employee
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'SUPERADMIN')">
                    <a class="nav-link" th:href="@{/admin/departments}">
                        <i class="bi bi-building me-1"></i>Departments
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'SUPERADMIN')">
                    <a class="nav-link" th:href="@{/admin/positions}">
                        <i class="bi bi-briefcase me-1"></i>Positions
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('SUPERADMIN')">
                    <a class="nav-link" th:href="@{/admin/users}">
                        <i class="bi bi-person-badge me-1"></i>Users
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i>
                        <span sec:authentication="name">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <span class="dropdown-item-text text-muted">
                                Role: <span sec:authentication="principal.authorities">ROLE</span>
                            </span>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <a class="dropdown-item" th:href="@{/profile}">
                                <i class="bi bi-person me-2 text-primary"></i>My Profile
                            </a>
                        </li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container mt-5">
    <div class="row mb-4">
        <div class="col">
            <h2 class="fw-bold">
                <i class="bi bi-speedometer2 me-2 text-primary"></i>Dashboard
            </h2>
            <p class="text-muted">Welcome back, <span sec:authentication="name" class="fw-semibold">User</span>!</p>
        </div>
    </div>

    <div class="row g-4">
        <!-- Total Employees Card -->
        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body text-center p-4">
                    <div class="bg-primary bg-opacity-10 rounded-circle d-inline-flex p-3 mb-3">
                        <i class="bi bi-people-fill text-primary" style="font-size: 2rem;"></i>
                    </div>
                    <h2 class="fw-bold mb-1" th:text="${employeeCount}">0</h2>
                    <p class="text-muted mb-0">Total Employees</p>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body text-center p-4">
                    <div class="bg-success bg-opacity-10 rounded-circle d-inline-flex p-3 mb-3">
                        <i class="bi bi-search text-success" style="font-size: 2rem;"></i>
                    </div>
                    <h5 class="fw-bold mb-2">Browse Directory</h5>
                    <a th:href="@{/employees}" class="btn btn-outline-success btn-sm">
                        View All Employees
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-4" sec:authorize="hasRole('ADMIN')">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body text-center p-4">
                    <div class="bg-warning bg-opacity-10 rounded-circle d-inline-flex p-3 mb-3">
                        <i class="bi bi-person-plus-fill text-warning" style="font-size: 2rem;"></i>
                    </div>
                    <h5 class="fw-bold mb-2">Add Employee</h5>
                    <a th:href="@{/admin/employees/add}" class="btn btn-outline-warning btn-sm">
                        Add New Employee
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
