<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 Internal Server Error - Employee Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

<div class="container text-center">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="display-1 fw-bold text-danger">500</h1>
            <h2 class="mb-4">Internal Server Error</h2>
            
            <div class="alert alert-danger mx-auto text-start shadow-sm mb-5" style="max-width: 600px;">
                <h5 class="alert-heading"><i class="bi bi-exclamation-triangle-fill me-2"></i>What happened?</h5>
                <p class="mb-0" th:text="${errorMessage != null ? errorMessage : 'We are experiencing an internal server problem. Please try again later.'}"></p>
            </div>
            
            <a th:href="@{/dashboard}" class="btn btn-primary btn-lg">
                <i class="bi bi-house-door me-2"></i>Return to Dashboard
            </a>
        </div>
    </div>
</div>

</body>
</html>
